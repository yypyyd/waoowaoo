x-self-hosted-storage-environment: &self-hosted-storage-environment
  S3_ENDPOINT: "http://minio:9000"
  S3_UPLOAD_ENDPOINT: "http://minio:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "${MINIO_BUCKET:-waoowaoo}"
  S3_ACCESS_KEY_ID: "${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in .env}"
  S3_SECRET_ACCESS_KEY: "${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in .env}"
  S3_SESSION_TOKEN: ""
  S3_FORCE_PATH_STYLE: "true"

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      SELF_HOSTED_HOST: "${SELF_HOSTED_HOST:-localhost}"
      SELF_HOSTED_HTTPS_PORT: "${SELF_HOSTED_HTTPS_PORT:-1443}"
      APP_HOST_PORT: "${APP_HOST_PORT:-13000}"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${SELF_HOSTED_HTTPS_PORT:-1443}:${SELF_HOSTED_HTTPS_PORT:-1443}"
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-13000}:${APP_HOST_PORT:-13000}"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6

  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    volumes:
      - minio_data:/bitnami/minio/data

  minio-init:
    image: bitnamilegacy/minio-client:latest
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
      MINIO_BUCKET: "${MINIO_BUCKET:-waoowaoo}"
      MINIO_APP_ACCESS_KEY: "${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in .env}"
      MINIO_APP_SECRET_KEY: "${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in .env}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$MINIO_BUCKET" in
          ''|*[!a-z0-9.-]*|[-.]*|*[-.]|*..*|*.-*|*-.*)
            echo "MINIO_BUCKET must be a lowercase S3 bucket name" >&2
            exit 1
            ;;
          *) ;;
        esac
        if [ "$${#MINIO_BUCKET}" -lt 3 ] || [ "$${#MINIO_BUCKET}" -gt 63 ]; then
          echo "MINIO_BUCKET must contain between 3 and 63 characters" >&2
          exit 1
        fi
        attempt=1
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          if [ "$$attempt" -ge 60 ]; then
            echo "MinIO did not become ready" >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 1
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        policy_path=/tmp/waoowaoo-app-policy.json
        printf '%s\n' \
          '{' \
          '  "Version": "2012-10-17",' \
          '  "Statement": [' \
          '    {' \
          '      "Effect": "Allow",' \
          '      "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],' \
          "      \"Resource\": [\"arn:aws:s3:::$$MINIO_BUCKET\"]" \
          '    },' \
          '    {' \
          '      "Effect": "Allow",' \
          '      "Action": ["s3:AbortMultipartUpload", "s3:DeleteObject", "s3:GetObject", "s3:ListMultipartUploadParts", "s3:PutObject"],' \
          "      \"Resource\": [\"arn:aws:s3:::$$MINIO_BUCKET/*\"]" \
          '    }' \
          '  ]' \
          '}' > "$$policy_path"
        mc admin policy create local waoowaoo-app-access "$$policy_path"
        mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY"
        mc admin policy attach local waoowaoo-app-access --user "$$MINIO_APP_ACCESS_KEY"
        echo "MinIO bucket '$$MINIO_BUCKET' is ready."

  app:
    # The browser must enter through Caddy; do not retain the base HTTP port.
    ports: !reset []
    environment:
      <<: *self-hosted-storage-environment
      NEXTAUTH_URL: "https://${SELF_HOSTED_HOST:-localhost}:${SELF_HOSTED_HTTPS_PORT:-1443}"
      TRUSTED_PROXY_HOPS: "1"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  temporal-worker-blue:
    environment: *self-hosted-storage-environment
    depends_on:
      minio-init:
        condition: service_completed_successfully

  temporal-worker-green:
    environment: *self-hosted-storage-environment
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  caddy_data:
  caddy_config:
  minio_data:
